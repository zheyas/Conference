version: "3.8"

services:
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/db
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=conference.settings
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  sqlite_data:
  media_data:
  static_data: