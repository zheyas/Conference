{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center futuristic-gradient py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Вход в систему</h2>
            <p class="text-gray-600">Введите данные для входа в личный кабинет</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Электронная почта</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                {{ form.password }}
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox"
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                        Запомнить меня
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
                        Забыли пароль?
                    </a>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full btn-neon py-3 px-4 text-lg font-bold">
                    Войти
                </button>
            </div>
        </form>

        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Нет аккаунта?</span>
                </div>
            </div>

            <div class="mt-6 text-center">
                <a href="{% url 'register' %}" class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Зарегистрироваться
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
